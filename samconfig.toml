version = 0.1

[default]
[default.global.parameters]
stack_name = "tsubuyaki-tune"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "tsubuyaki-tune"
region = "ap-northeast-1"
disable_rollback = true
parameter_overrides = "region=\"ap-northeast-1\" googleRedirectUrl=\"http://localhost:3000/signin\" googleClientSecret=\"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\" authTableName=\"TsubuyakiUserTable\""
image_repositories = []

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
